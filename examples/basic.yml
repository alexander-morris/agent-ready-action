# The simplest useful setup: a weekly PR with whatever fixes are available.
name: Agent Ready

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  agent-ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: alexander-morris/agent-ready-action@v1
        with:
          url: https://example.com
